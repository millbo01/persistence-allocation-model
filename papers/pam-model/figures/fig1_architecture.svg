   </g>
   <g id="text_3">
    <text style="font-size: 7.6px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(13.640538 86.099192)">through the</text>
    <text style="font-size: 7.6px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(23.464131 96.220997)">intake</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="33.6321" y="137.125322" transform="rotate(-0 33.6321 137.125322)">Outside</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.6px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(13.386413 151.307284)">input across</text>
    <text style="font-size: 7.6px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(11.072569 160.59487)">the boundary</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="129.636" y="90.357238" transform="rotate(-0 129.636 90.357238)">Shared flow</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(106.57725 105.682688)">what reaches</text>
    <text style="font-size: 8px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(106.61725 114.56972)">the parts this</text>
    <text style="font-size: 8px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(107.869125 124.329876)">step; what is</text>
    <text style="font-size: 8px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(107.87975 134.963157)">not drawn is</text>
    <text style="font-size: 8px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(107.3735 144.723313)">not returned</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="129.636" y="185.92626" transform="rotate(-0 129.636 185.92626)">Stores</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.4px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(99.086719 200.500882)">drawn first; release</text>
    <text style="font-size: 7.4px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(95.812797 209.115667)">limited (proportional</text>
    <text style="font-size: 7.4px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(112.141938 218.163468)">by default)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="133.7652" y="165.78158" transform="rotate(-0 133.7652 165.78158)">store draw</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="168.8634" y="35.096848" transform="rotate(-0 168.8634 35.096848)">Governor</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.6px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(114.718744 49.8153)">sets access: store release, intake,</text>
    <text style="font-size: 7.6px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(129.116588 58.683105)">gates, pathway capacity</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="343.3221" y="32.257059" transform="rotate(-0 343.3221 32.257059)">The ordered draw</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.4px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="343.3221" y="44.078824" transform="rotate(-0 343.3221 44.078824)">each takes its need, in order</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="267.55128" y="88.744707" transform="rotate(-0 267.55128 88.744707)">1  The top</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="267.55128" y="97.438926" transform="rotate(-0 267.55128 97.438926)">its output is the record the governor holds</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="267.55128" y="114.913299" transform="rotate(-0 267.55128 114.913299)">2  Basal maintenance</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="267.55128" y="123.566057" transform="rotate(-0 267.55128 123.566057)">of every part</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="267.55128" y="140.92353" transform="rotate(-0 267.55128 140.92353)">3  Supports and the intake</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="267.55128" y="149.706015" transform="rotate(-0 267.55128 149.706015)">work and renewal</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="267.55128" y="166.993325" transform="rotate(-0 267.55128 166.993325)">4  Other parts, by rank</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="267.55128" y="175.76374" transform="rotate(-0 267.55128 175.76374)">work and renewal; repair is one of them</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 8.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="267.55128" y="193.228995" transform="rotate(-0 267.55128 193.228995)">5  What is left</text>
   </g>
   <g id="text_24">
    <text style="font-size: 7.1px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="267.55128" y="201.834292" transform="rotate(-0 267.55128 201.834292)">rebuild, or refill stores, by marginal value</text>
   </g>
   <g id="text_25">
    <text style="font-size: 7px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(185.921875 75.124672)">the flow is drawn</text>
    <text style="font-size: 7px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(183.051875 82.773813)">from the top down</text>
   </g>
   <g id="text_26">
    <text style="font-size: 7px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: middle; fill: #52514e" x="212.22" y="209.54068" transform="rotate(-0 212.22 209.54068)">refill</text>
   </g>
   <g id="text_27">
    <text style="font-size: 7.2px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(228.452186 162.084276) rotate(-90)">under scarcity,</text>
    <text style="font-size: 7.2px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(237.403811 160.797276) rotate(-90)">shortfall lands</text>
    <text style="font-size: 7.2px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #52514e" transform="translate(244.726436 179.787276) rotate(-90)">from the bottom up</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.8246" y="247.478346" transform="rotate(-0 7.8246 247.478346)">The load ledger:</text>
   </g>
   <g id="text_29">
    <text style="font-size: 7.6px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="78.021" y="247.415846" transform="rotate(-0 78.021 247.415846)">gap = store draw + outside input + load left unmet at named parts. Access decides where load lands, not how much.</text>
   </g>
   <g id="text_30">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.8246" y="263.066512" transform="rotate(-0 7.8246 263.066512)">Residue in units:</text>
   </g>
   <g id="text_31">
    <text style="font-size: 7.6px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="78.021" y="262.926621" transform="rotate(-0 78.021 262.926621)">switched off (route back kept) → lost (rebuildable) → scarred (template lost).</text>
   </g>
   <g id="text_32">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.8246" y="278.5571" transform="rotate(-0 7.8246 278.5571)">Failure:</text>
